<div id="edit-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-skill-modal-title">
  <button type="button"
          class="project-form-modal_backdrop"
          popovertarget="edit-skill-modal"
          popovertargetaction="hide"
          aria-label="Tutup modal"></button>
  <div class="project-form-modal_content">
    <button type="button"
            class="project-form-modal_close"
            popovertarget="edit-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup modal">&times;</button>
    <div class="comic-badge-banner" style="margin-bottom: 0.5rem;">
      <span class="comic-dot red"></span>
      <span class="comic-dot yellow"></span>
      <span class="comic-dot green"></span>
      <code class="comic-header-tag">CONSOLE // EDIT-SKILL</code>
    </div>
    <p class="hero-kicker" style="margin-bottom: 0.25rem;">PERBARUI KEAHLIAN</p>
    <h2 id="edit-skill-modal-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.5rem; margin-bottom: 1.25rem; color: var(--ink);">
      Edit Skill
    </h2>

    <form id="edit-skill-form" class="project-form">
      <input type="hidden" id="edit-skill-id" name="id">

      <div class="form-group">
        <label for="edit-skill-name">Skill Name</label>
        <input type="text"
               id="edit-skill-name"
               name="name"
               class="form-input"
               maxlength="100"
               placeholder="e.g., Python, Linux Kernel"
               required>
      </div>

      <div class="form-group">
        <label for="edit-skill-category">Category</label>
        <select id="edit-skill-category" name="category" class="form-input">
          <option value="languages">Programming Languages</option>
          <option value="frameworks">Frameworks &amp; Tools</option>
          <option value="systems">Systems &amp; Architecture</option>
          <option value="security">Cybersecurity &amp; Networking</option>
          <option value="others">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="edit-skill-proficiency">Proficiency (%)</label>
        <input type="number"
               id="edit-skill-proficiency"
               name="proficiency_percent"
               class="form-input"
               min="0"
               max="100"
               placeholder="85"
               required>
      </div>

      <div class="form-group">
        <label for="edit-skill-logo">Logo URL (Google Drive / Direct Link)</label>
        <input type="url"
               id="edit-skill-logo"
               name="logo_url"
               class="form-input"
               placeholder="https://drive.google.com/thumbnail?id=...&sz=w1000">
      </div>

      <div class="form-group">
        <label for="edit-skill-core">Highlight as Core Skill?</label>
        <input type="checkbox"
               id="edit-skill-core"
               name="is_core"
               class="form-checkbox">
      </div>

      <div class="form-actions-group" style="margin-top: 1.75rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
        <button type="button"
                class="comic-btn comic-btn-secondary"
                popovertarget="edit-skill-modal"
                popovertargetaction="hide">
          Batal
        </button>
        <button type="submit" class="comic-btn comic-btn-primary">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>
</div>
