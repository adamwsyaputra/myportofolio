<button type="button"
        class="button-danger-sm"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Hapus {{ project.title }}">
  Hapus
</button>

<div id="delete-project-{{ project.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true">
  <button type="button"
          class="project-delete-modal_backdrop"
          popovertarget="delete-project-{{ project.id }}"
          popovertargetaction="hide"></button>
  <div class="project-delete-modal_content">
    <button type="button"
            class="project-delete-modal_close"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide">&times;</button>
    <h2>Hapus Proyek?</h2>
    <p>Apakah Anda yakin ingin menghapus <strong>{{ project.title }}</strong>?</p>
    <div class="project-delete-modal_actions">
      <button type="button"
              class="social-link"
              style="border: none; cursor: pointer; background: var(--line); color: var(--ink);"
              popovertarget="delete-project-{{ project.id }}"
              popovertargetaction="hide">Batal</button>
      <form method="post" action="{% url 'main:delete_project' project.id %}">
        {% csrf_token %}
        <button type="submit" class="button-danger-sm" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Ya, Hapus</button>
      </form>
    </div>
  </div>
</div>
